# no "version" key
#
# ONE service on purpose. The legacy `app` service (stock node:lts, root,
# HOME=/tmp, no pg_net) was deleted 2026-08-26: it could not reach Postgres
# and existed only for the retired node_mod_cache warm-up.

services:
  # Runtime service AND owner of the shared image: hhm_rpp:${IMAGE_TAG} is
  # built HERE (docker/Dockerfile — baked gosu entrypoint dropping to
  # RUN_USER, default svc) and consumed as-is by hhm_rpp_philips and
  # hhm_rpp_siemens (neither has a Dockerfile, on purpose). Dev trees build
  # hhm_rpp:<username>; the release copy builds hhm_rpp:svc, and
  # build-release.sh re-points the `staging` alias for un-migrated philips.
  app_tools:
    image: hhm_rpp:${IMAGE_TAG}
    build:
      context: .
      dockerfile: docker/Dockerfile
      # Host identity comes from .env so this file stays host-agnostic and the
      # dev and staging branches can share it. See .env.example.
      args:
        DOCKER_GID: ${DOCKER_GID}
        UID_0: ${UID_0}
        UID_1: ${UID_1}
        UID_2: ${UID_2}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /workspace
    volumes:
      # 1) Project source → live edit on host reflects in container.
      #    node_modules is IN-TREE (installed by build.sh as the host user),
      #    so it rides along in this mount — no separate cache mount.
      - ./:/workspace

      # 2) Run logs. Host destination is env-dependent; defaults to the DEV
      #    path so a missing LOG_DIR fails safe (never writes /opt/run-logs).
      - ${LOG_DIR:-./utils/logger/logs}:/workspace/utils/logger/logs

      # 3) ACQ files (read-only). Same path on host and container because the
      #    code builds absolute paths from DATA_STORE_DEV on both sides.
      - ${DATA_STORE_DEV}:${DATA_STORE_DEV}:ro
    environment:
      # Intentionally unset in .env: empty -> baked entrypoint defaults to svc
      # (one place decides the production identity). Dev runs pass it on the
      # command line. ':-' silences the compose WARN.
      RUN_USER: ${RUN_USER:-}
      # Keep npm's cache ephemeral (avoids permission issues on bind mounts)
      NPM_CONFIG_CACHE: /tmp/.npm
    networks:
      - redis_net
      - pg_net

# Declare external networks
networks:
  redis_net:
    external: true
    name: redis-admin_redis_net
  pg_net:
    external: true

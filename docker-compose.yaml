# no "version" key

x-common-env: &common_env
# Load environment variables from .env in the project root
  env_file:
    - .env

  # Allow containers to reach services on the host via this hostname
  extra_hosts:
    - "host.docker.internal:host-gateway"

  # Runtime env vars
  environment:
    # Don't write into root's $HOME inside the image; use a tmp home
    HOME: /tmp

    # Keep npm's cache ephemeral (avoids permission issues on bind mounts)
    NPM_CONFIG_CACHE: /tmp/.npm

x-common-mounts: &common_mounts
  working_dir: /workspace
  volumes:
  # --- Bind mounts (host paths must exist) ---

    # 1) Project source → live edit on host reflects in container
    - ./:/workspace
    
    # 2) Cache node_modules on host (survives container removal)
    - /opt/resources/node_mod_cache/hhm_rpp_ge:/workspace/node_modules

    # 3) Centralized run logs on host
    - /opt/run-logs/hhm_rpp_ge:/opt/run-logs/hhm_rpp_ge

    # 4) ACQ files from first app (READ ONLY)
    - ${DATA_STORE_DEV}:${DATA_STORE_DEV}:ro

# ---------- Services ----------
services:
  # Lightweight container for running the app as-is
  app:
    # Base Node image (moves with LTS). For reproducibility, consider pinning:
    # image: node:22-bookworm (10/30/25)
    image: node:lts

    # Merge in common env + mounts
    <<: [*common_env, *common_mounts]
    networks:
      - redis_net              # <-- attach to the external Redis network
    environment:
      # Prefer hostname over container IP
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: "${REDIS_PORT}"

# Reduced app image (see docker/Dockerfile): baked gosu entrypoint, no
# acquisition tooling (lftp/rsync/sshpass/mdbtools/expect) since this app
# only reads ACQ files + talks to PG/Redis.
  app_tools:
    # This repo OWNS the shared `hhm_rpp` image, consumed as-is by
    # hhm_rpp_philips and hhm_rpp_siemens (neither has a Dockerfile). It was
    # previously built by hand and had no build stanza here, which is why a
    # fresh host had no way to produce it. Build with:
    #   docker compose build app_tools
    image: hhm_rpp:${IMAGE_TAG}
    build:
      context: .
      dockerfile: docker/Dockerfile
      # Host identity comes from .env so this file stays host-agnostic and the
      # dev and staging branches can share it. See .env.example.
      args:
        DOCKER_GID: ${DOCKER_GID}
        UID_0: ${UID_0}
        UID_1: ${UID_1}
        UID_2: ${UID_2}
    <<: [*common_env, *common_mounts]
    volumes:
      - ./:/workspace
      - /opt/resources/node_mod_cache/hhm_rpp_ge:/workspace/node_modules
      - /opt/run-logs/hhm_rpp_ge:/opt/run-logs/hhm_rpp_ge
      - ${DATA_STORE_DEV}:${DATA_STORE_DEV}:ro
    environment:
      RUN_USER: ${RUN_USER}
      NPM_CONFIG_CACHE: /tmp/.npm
    networks:
      - redis_net
      - pg_net

# Declare external networks
networks:
  redis_net:
    external: true
    name: redis-admin_redis_net
  pg_net:
    external: true